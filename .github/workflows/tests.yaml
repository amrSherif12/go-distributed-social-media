name: Tests

on:
  pull_request:
    branches: [ "main" ]

env:
  JWT_KEY: ${{ vars.JWT_KEY }}
  SQL_DB_USER: ${{ vars.SQL_DB_USER }}
  SQL_DB_PASS: ${{ vars.SQL_DB_PASS }}
  USER_SRV_PORT: ${{ vars.USER_SRV_PORT }}
  USER_DB_PORT: ${{ vars.USER_DB_PORT }}
  USER_DB_NAME: ${{ vars.USER_DB_NAME }}
  GATEWAY_PORT: ${{ vars.GATEWAY_PORT }}
  POST_DB_PORT: ${{ vars.POST_DB_PORT }}
  POST_DB_USER: ${{ vars.POST_DB_USER }}
  POST_DB_PASS: ${{ vars.POST_DB_PASS }}
  POST_DB_NAME: ${{ vars.POST_DB_NAME }}
  POST_CACHE_HOST: ${{ vars.POST_CACHE_HOST }}
  POST_EVENT_BROKER_PORT: ${{ vars.POST_EVENT_BROKER_PORT }}
  POST_EVENT_BROKER_USER: ${{ vars.POST_EVENT_BROKER_USER }}
  POST_EVENT_BROKER_PASS: ${{ vars.POST_EVENT_BROKER_PASS }}
  POST_EVENT_QUEUE: ${{ vars.POST_EVENT_QUEUE }}
  POST_SRV_PORT: ${{ vars.POST_SRV_PORT }}
  POST_OBJ_DB_PUBLIC_HOST: ${{ vars.POST_OBJ_DB_PUBLIC_HOST }}
  POST_OBJ_DB_PORT: ${{ vars.POST_OBJ_DB_PORT }}
  POST_OBJ_DB_USER: ${{ vars.POST_OBJ_DB_USER }}
  POST_OBJ_DB_PASS: ${{ vars.POST_OBJ_DB_PASS }}
  POST_OBJ_DB_NAME: ${{ vars.POST_OBJ_DB_NAME }}
  POST_OBJ_DB_BUCKET: ${{ vars.POST_OBJ_DB_BUCKET }}
  POST_OBJ_DB_REGION: ${{ vars.POST_OBJ_DB_REGION }}
  POST_CACHE_PORT: ${{ vars.POST_CACHE_PORT }}


jobs:
  test:
    name: Run unit and integration tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.27'

      - name: Run unit tests
        run: go test -v ./...

      - name: Setup test containers
        run: docker compose -f ./deployment/docker-compose.yaml -f ./deployment/docker-compose.test.yaml up -d --build

      - name: Run integration tests
        env:
          GATEWAY_PORT: ${{ vars.GATEWAY_PORT }}
        run: go test -v -tags=integration ./tests/integration/

      - name: Teardown Infrastructure
        if: always()
        run: docker compose -f ./deployment/docker-compose.yaml -f ./deployment/docker-compose.test.yaml down -v

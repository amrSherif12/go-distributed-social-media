name: Deployment

on:
  push:
    branches: ["main"]

jobs:
  build-and-push:
    name: Build & Push images
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
       service: [user_service, gateway, post_service, follow_service]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push ${{ matrix.service }} image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deployment/Dockerfile
          push: true
          build-args: SRV_NAME=${{ matrix.service }}
          tags: |
            ghcr.io/amrsherif12/go-distributed-social-media/${{ matrix.service }}:latest
            ghcr.io/amrsherif12/go-distributed-social-media/${{ matrix.service }}:${{ github.sha }}

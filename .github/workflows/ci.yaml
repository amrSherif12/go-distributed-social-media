name: CI Pipeline

on:
  pull_request:
    branches: [ "main" ]

env:
  JWT_KEY: ${{ vars.JWT_KEY }}
  SQL_DB_USER: ${{ vars.SQL_DB_USER }}
  SQL_DB_PASS: ${{ vars.SQL_DB_PASS }}
  USER_SRV_PORT: ${{ vars.USER_SRV_PORT }}
  USER_DB_PORT: ${{ vars.USER_DB_PORT }}
  USER_DB_NAME: ${{ vars.USER_DB_NAME }}
  GATEWAY_PORT: ${{ vars.GATEWAY_PORT }}


jobs:
  test:
    name: Run unit and integration tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.27'

      - name: Run unit tests
        run: go test -v ./...

      - name: Setup test containers
        run: docker compose -f ./deployment/docker-compose.yaml -f ./deployment/docker-compose.test.yaml up -d --build

      - name: Run integration tests
        run: go test -v -tags=integration ./tests/integration/

      - name: Teardown Infrastructure
        if: always()
        run: docker compose -f ./deployment/docker-compose.yaml -f ./deployment/docker-compose.test.yaml down -v


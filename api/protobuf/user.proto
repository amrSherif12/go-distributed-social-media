syntax = "proto3";

package user.v1;
option go_package = "go_distributed_social_media/api/pb;pb";

service UserService {
  rpc GetUser(GetUserRequest) returns (User);
  rpc Register(RegisterRequest) returns (EmptyResponse);
  rpc Login(LoginRequest) returns (EmptyResponse);
}

message EmptyResponse {};

message User {
  string id = 1;
  string name = 2;
  string email = 3;
}
message RegisterRequest {
  string name = 1;
  string email = 2;
  string password = 3;
  string passwordConf = 4 [json_name = "password_confirmation"];
}

message LoginRequest {
  string email = 1;
  string password = 2;
}

message GetUserRequest {
  string id = 1;
}

message GetUserResponse {
  User user = 1;
}
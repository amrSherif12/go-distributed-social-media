services:
  user-service:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
      args:
        SRV_NAME: user_service
    ports:
      - "${USER_SRV_PORT}:${USER_SRV_PORT}"
    environment:
      - JWT_KEY=${JWT_KEY}
      - SQL_DB_USER=${SQL_DB_USER}
      - SQL_DB_PASS=${SQL_DB_PASS}
      - USER_DB_HOST=user-db
      - USER_DB_PORT=${USER_DB_PORT}
      - USER_DB_NAME=${USER_DB_NAME}
      - USER_SRV_PORT=${USER_SRV_PORT}
    networks:
      - net
    depends_on:
      user-db:
        condition: "service_healthy"
    healthcheck:
      test: [ "CMD-SHELL", "pidof service || exit 1" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  user-db:
    image: mysql:8.4.9
    ports:
      - "${USER_DB_PORT}:${USER_DB_PORT}"
    environment:
      - MYSQL_ROOT_PASSWORD=${SQL_DB_PASS}
      - MYSQL_DATABASE=${USER_DB_NAME}
    networks:
      - net
    volumes:
      - "user-db-data:/var/lib/mysql"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-P", "3306", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 30s

  gateway:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
      args:
        SRV_NAME: gateway
    environment:
      - JWT_KEY=${JWT_KEY}
      - USER_SRV_HOST=user-service
      - USER_SRV_PORT=${USER_SRV_PORT}
      - GATEWAY_PORT=${GATEWAY_PORT}
      - GATEWAY_HOST=0.0.0.0
    ports:
      - "${GATEWAY_PORT}:${GATEWAY_PORT}"
    networks:
      - net
    depends_on:
      user-service:
        condition: "service_healthy"

volumes:
  user-db-data:

networks:
  net:
    driver: bridge
services:
  user-service:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
      args:
        SRV_NAME: user_service
    ports:
      - "${USER_SRV_PORT}:${USER_SRV_PORT}"
    environment:
      - JWT_KEY=${JWT_KEY}
      - SQL_DB_USER=${SQL_DB_USER}
      - SQL_DB_PASS=${SQL_DB_PASS}
      - USER_DB_HOST=user-db
      - USER_DB_PORT=${USER_DB_PORT}
      - USER_DB_NAME=${USER_DB_NAME}
      - USER_SRV_PORT=${USER_SRV_PORT}
    depends_on:
      user-db:
        condition: "service_healthy"
    healthcheck:
      test: [ "CMD-SHELL", "pidof service || exit 1" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  user-db:
    image: mysql:8.4.9
    ports:
      - "${USER_DB_HOST_PORT:-${USER_DB_PORT}}:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=${SQL_DB_PASS}
      - MYSQL_DATABASE=${USER_DB_NAME}
    volumes:
      - "user-db-data:/var/lib/mysql"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-P", "3306", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 30s

  gateway:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
      args:
        SRV_NAME: gateway
    environment:
      - JWT_KEY=${JWT_KEY}
      - USER_SRV_HOST=user-service
      - USER_SRV_PORT=${USER_SRV_PORT}
      - POST_SRV_HOST=post-service
      - POST_SRV_PORT=${POST_SRV_PORT}
      - FOLLOW_SRV_HOST=follow-service
      - FOLLOW_SRV_PORT=${FOLLOW_SRV_PORT}
      - FEED_SRV_HOST=feed-service
      - FEED_SRV_PORT=${FEED_SRV_PORT:-50054}
      - GATEWAY_PORT=${GATEWAY_PORT}
    ports:
      - "${GATEWAY_PORT}:${GATEWAY_PORT}"
    depends_on:
      user-service:
        condition: "service_healthy"
      post-service:
        condition: "service_healthy"
      follow-service:
        condition: "service_healthy"
      feed-service:
        condition: "service_healthy"

  post-db:
    image: mongo:7.0
    container_name: shop-mongodb
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${POST_DB_USER}
      - MONGO_INITDB_ROOT_PASSWORD=${POST_DB_PASS}
    ports:
      - "${POST_DB_PORT}:${POST_DB_PORT}"
    volumes:
      - post-db-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 15

  post-cache:
    image: redis:7-alpine
    container_name: post-redis
    ports:
      - "${POST_CACHE_PORT}:${POST_CACHE_PORT}"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  post-queue:
    image: rabbitmq:4-management-alpine
    container_name: post-rabbitmq
    user: "999:999"
    environment:
      RABBITMQ_DEFAULT_USER: ${POST_EVENT_BROKER_USER}
      RABBITMQ_DEFAULT_PASS: ${POST_EVENT_BROKER_PASS}
    ports:
      - "${POST_EVENT_BROKER_PORT}:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 30s

  post-obj-db:
    image: localstack/localstack:3.8
    container_name: minio
    restart: unless-stopped
    ports:
      - "${POST_OBJ_DB_PORT}:${POST_OBJ_DB_PORT}"
    environment:
      - SERVICES=s3
      - AWS_DEFAULT_REGION=${POST_OBJ_DB_REGION}
    volumes:
      - "post-obj-db:/var/lib/localstack"
      - "/var/run/docker.sock:/var/run/docker.sock"

  post-service:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
      args:
        SRV_NAME: post_service
    ports:
      - "${POST_SRV_PORT}:${POST_SRV_PORT}"
    environment:
      - POST_SRV_PORT=${POST_SRV_PORT}
      - POST_DB_HOST=post-db
      - POST_DB_PORT=27017
      - POST_DB_USER=${POST_DB_USER}
      - POST_DB_PASS=${POST_DB_PASS}
      - POST_DB_NAME=${POST_DB_NAME}
      - POST_CACHE_HOST=post-cache
      - POST_CACHE_PORT=6379
      - POST_EVENT_BROKER_HOST=post-queue
      - POST_EVENT_BROKER_PORT=5672
      - POST_EVENT_BROKER_USER=${POST_EVENT_BROKER_USER}
      - POST_EVENT_BROKER_PASS=${POST_EVENT_BROKER_PASS}
      - POST_EVENT_QUEUE=${POST_EVENT_QUEUE}
      - POST_OBJ_DB_HOST=post-obj-db
      - POST_OBJ_DB_PUBLIC_HOST=${POST_OBJ_DB_PUBLIC_HOST}
      - POST_OBJ_DB_PORT=${POST_OBJ_DB_PORT}
      - POST_OBJ_DB_USER=${POST_OBJ_DB_USER}
      - POST_OBJ_DB_PASS=${POST_OBJ_DB_PASS}
      - POST_OBJ_DB_BUCKET=${POST_OBJ_DB_BUCKET}
      - POST_OBJ_DB_REGION=${POST_OBJ_DB_REGION}
    depends_on:
      post-db:
        condition: service_healthy
      post-cache:
        condition: service_healthy
      post-queue:
        condition: service_healthy
      post-obj-db:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "pidof service || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  follow-db:
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: ${FOLLOW_DB_USER}/${FOLLOW_DB_PASS}
      FOLLOW_DB_USER: ${FOLLOW_DB_USER}
      FOLLOW_DB_PASS: ${FOLLOW_DB_PASS}
    ports:
      - "${FOLLOW_DB_PORT}:7687"
    volumes:
      - follow-db-data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -a bolt://localhost:7687 -u \"$${FOLLOW_DB_USER}\" -p \"$${FOLLOW_DB_PASS}\" 'RETURN 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 60s

  follow-cache:
    image: redis:7-alpine
    ports:
      - "${FOLLOW_CACHE_PORT}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  follow-service:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
      args:
        SRV_NAME: follow_service
    expose:
      - "${FOLLOW_SRV_PORT}"
    environment:
      - FOLLOW_SRV_PORT=${FOLLOW_SRV_PORT}
      - FOLLOW_DB_HOST=follow-db
      - FOLLOW_DB_PORT=7687
      - FOLLOW_DB_USER=${FOLLOW_DB_USER}
      - FOLLOW_DB_PASS=${FOLLOW_DB_PASS}
      - FOLLOW_CACHE_HOST=follow-cache
      - FOLLOW_CACHE_PORT=6379
    depends_on:
      follow-db:
        condition: service_healthy
      follow-cache:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pidof service || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  feed-cache:
    image: redis:7-alpine
    ports:
      - "${FEED_CACHE_PORT:-6385}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  feed-service:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
      args:
        SRV_NAME: feed_service
    expose:
      - "${FEED_SRV_PORT:-50054}"
    environment:
      - FEED_SRV_PORT=${FEED_SRV_PORT:-50054}
      - FEED_CACHE_HOST=feed-cache
      - FEED_CACHE_PORT=6379
      - FOLLOW_SRV_HOST=follow-service
      - FOLLOW_SRV_PORT=${FOLLOW_SRV_PORT}
      - POST_SRV_HOST=post-service
      - POST_SRV_PORT=${POST_SRV_PORT}
      - POST_EVENT_BROKER_HOST=post-queue
      - POST_EVENT_BROKER_PORT=5672
      - POST_EVENT_BROKER_USER=${POST_EVENT_BROKER_USER}
      - POST_EVENT_BROKER_PASS=${POST_EVENT_BROKER_PASS}
      - POST_EVENT_QUEUE=${POST_EVENT_QUEUE}
    depends_on:
      feed-cache:
        condition: service_healthy
      follow-service:
        condition: service_healthy
      post-service:
        condition: service_healthy
      post-queue:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pidof service || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  user-db-data:
  post-db-data:
  post-obj-db:
  follow-db-data:
  rabbitmq-data: